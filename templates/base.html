<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ERP Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="min-h-screen flex" x-data="{ setupOpen: true, purchaseOpen: true }">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-900 text-slate-200 flex flex-col flex-shrink-0">
            <div class="h-16 flex items-center justify-center bg-slate-950 font-bold text-xl tracking-wider text-indigo-400">
                ERP SYSTEM
            </div>

            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a href="{% url 'home' %}" class="flex items-center px-3 py-2 text-sm font-medium rounded-lg hover:bg-slate-800 transition">
                    📌 Dashboard Home
                </a>

                <!-- 1. SETUP MODULE -->
                <div>
                    <button @click="setupOpen = !setupOpen" class="w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-lg hover:bg-slate-800 transition text-slate-300">
                        <span>⚙️ Setup</span>
                        <span x-text="setupOpen ? '▾' : '▸'"></span>
                    </button>
                    <div x-show="setupOpen" class="mt-1 pl-6 space-y-1">
                        <a href="{% url 'vendor_entry' %}" class="block px-3 py-1.5 text-xs rounded-md text-slate-400 hover:text-white hover:bg-slate-800">
                            • Vendor Entry
                        </a>
                        <a href="{% url 'vendor_report' %}" class="block px-3 py-1.5 text-xs rounded-md text-slate-400 hover:text-white hover:bg-slate-800">
                            • Vendor Entry Report
                        </a>
                    </div>
                </div>

                <!-- 2. PURCHASE MODULE -->
                <div>
                    <button @click="purchaseOpen = !purchaseOpen" class="w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-lg hover:bg-slate-800 transition text-slate-300">
                        <span>🛒 Purchase</span>
                        <span x-text="purchaseOpen ? '▾' : '▸'"></span>
                    </button>
                    <div x-show="purchaseOpen" class="mt-1 pl-6 space-y-1">
                        <a href="{% url 'mpr_entry' %}" class="block px-3 py-1.5 text-xs rounded-md text-slate-400 hover:text-white hover:bg-slate-800">
                            • MPR Entry
                        </a>
                        <a href="{% url 'mpr_report' %}" class="block px-3 py-1.5 text-xs rounded-md text-slate-400 hover:text-white hover:bg-slate-800">
                            • MPR Reports
                        </a>
                        <a href="{% url 'po_entry' %}" class="block px-3 py-1.5 text-xs rounded-md text-slate-400 hover:text-white hover:bg-slate-800">
                            • PO Entry
                        </a>
                        <a href="{% url 'po_report' %}" class="block px-3 py-1.5 text-xs rounded-md text-slate-400 hover:text-white hover:bg-slate-800">
                            • PO Reports
                        </a>
                    </div>
                </div>
            </nav>

            <!-- User Info Section -->
            <div class="p-4 border-t border-slate-800 bg-slate-950 flex items-center justify-between">
                <span class="text-xs font-semibold text-indigo-300">👤 {{ request.user.username }}</span>
                <form action="{% url 'logout' %}" method="post" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="text-xs text-red-400 hover:underline">Logout</button>
                </form>
            </div>
        </aside>

        <!-- Main Body Content -->
        <main class="flex-1 flex flex-col">
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8">
                <h1 class="text-xl font-bold text-gray-800">{% block header_title %}Dashboard{% endblock %}</h1>
            </header>
            
            <div class="p-8 flex-1">
                {% block content %}{% endblock %}
            </div>
        </main>

    </div>

</body>
</html>
